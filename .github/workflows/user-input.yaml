
name: testing user input

on:
  workflow_dispatch:
    inputs:
      number1:
        description: 'first number'
        default: '0'
        required: true
      number2:
        description: 'second number'
        default: '0'
        required: true

jobs:
  sub_numbers:
    runs-on: ubuntu-latest

    steps:
      - name: subtract numbers
        id: sub
        run: |
          sub=$((${{ inputs.number1 }} - ${{ inputs.number2 }}))
          echo "sub=$sub" >> "$GITHUB_OUTPUT"

      - name: Display sub
        run: echo "the sub of ${{ inputs.number1 }} and ${{ inputs.number2 }} is ${{ steps.sub.outputs.sub }}"
