
name: testing user input

on:
  workflow_dispatch:
    inputs:
      number1:
        description: 'first number'
        default: '0'
        required: true
      number2:
        description: 'second number'
        default: '0'
        required: true

jobs:
  all_numbers:
    runs-on: ubuntu-latest


    steps:
      - name: sub  numbers
        id: sub
        run: |
          sub=$((${{ inputs.number1 }} - ${{ inputs.number2 }}))
          echo "sub=$sub" >> "$GITHUB_OUTPUT"
          
      - name: add numbers
        id: add
        run: |
          add=$((${{ inputs.number1 }} + ${{ inputs.number2}}))
          echo "add=$add" >> "$GITHUB_OUTPUT"
          
      - name: mul numbers
        id: mul
        run: |
          mul=$((${{ inputs.number1 }} * ${{ inputs.number2}}))
          echo "mul=$mul" >> "$GITHUB_OUTPUT"

      - name: Display sub
        run: echo "the sub of ${{ inputs.number1 }} and ${{ inputs.number2 }} is ${{ steps.sub.outputs.sub }}"

      - name: Display add
        run: echo "the addtion of ${{ inputs.number1 }} and ${{inputs.number2 }} is ${{ steps.add.outputs.add}}"

      - name: Display mul
        run: echo "the multiplication of ${{ inputs.number1 }} and ${{inputs.number2 }} is ${{ steps.mul.outputs.mul }}"
  
      
        
