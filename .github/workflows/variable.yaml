name: Testing workflow variable

on:
  workflow_dispatch:

env:
  cloud: google-cloud

jobs:
  greeting_job:
    runs-on: ubuntu-latest
    env: 
      Greeting: Hello
    steps:
      - name: "say hello to vishakha"
        run: echo "$Greeting $First_name is using $cloud"
        env:
          First_name: vishakha
