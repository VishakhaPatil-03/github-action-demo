name: testing configuration variable

on:
  workflow_dispatch

env:
  cloud: google-cloud

jobs:
  greeting_job:
    runs-on: ubuntu-latest
    env:
      Greeting: "Hello"
    steps:
      - name: "this was the vishakha github action repo"
        run: echo "$Greeting $First_name is using $cloud with their project ${{ vars.PROJECT_ID}}!"
        env:
          First_name: Vishakha
